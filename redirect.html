<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validando acceso...</title>
    <script src="auth.js"></script>
</head>
<body style="font-family:Segoe UI,Arial,sans-serif;text-align:center;padding-top:80px;">
    <p>Validando acceso, un momento...</p>

    <script>
    (async () => {
        try {
            const cuenta = await obtenerCuenta(); // procesa el token que vuelve de Microsoft
            window.location.replace(cuenta ? "dashboard.html" : "index.html");
        } catch (e) {
            console.error(e);
            window.location.replace("index.html");
        }
    })();
    </script>
</body>
</html>
