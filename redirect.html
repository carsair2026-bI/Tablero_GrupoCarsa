
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando acceso - Grupo Carsa</title>

    <link rel="shortcut icon" href="./icono.png">
    <link rel="icon" type="image/png" href="./icono.png">

    <script src="https://alcdn.msauth.net/browser/2.39.0/js/msal-browser.min.js"></script>

    <style>
        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:"Segoe UI",Arial,sans-serif;
            background:linear-gradient(135deg,#f5f7fa,#e4e8f0);
        }

        .card{
            width:90%;
            max-width:500px;
            background:#fff;
            border-radius:28px;
            padding:50px;
            text-align:center;
            box-shadow:0 25px 70px rgba(0,0,0,.15);
        }

        .logo{
            width:280px;
            max-width:100%;
            margin-bottom:20px;
        }

        h2{
            margin:0 0 10px;
            color:#111;
        }

        p{
            color:#666;
        }

        .spinner{
            margin:25px auto;
            width:42px;
            height:42px;
            border:4px solid #e4e8f0;
            border-top-color:#2f2f2f;
            border-radius:50%;
            animation:girar 0.9s linear infinite;
        }

        @keyframes girar{
            to{ transform:rotate(360deg); }
        }

        #mensaje{
            display:none;
            margin-top:15px;
            padding:15px;
            border-radius:10px;
            text-align:left;
        }

        .error{
            display:block;
            background:#fdecec;
            color:#b00020;
        }

        .success{
            display:block;
            background:#eaf7ed;
            color:#187333;
        }

        a.volver{
            display:inline-block;
            margin-top:15px;
            color:#2f2f2f;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="card">
    <img src="logo.png" class="logo" alt="Grupo Carsa">
    <h2>Validando tu acceso</h2>
    <p>Por favor espera un momento...</p>
    <div class="spinner" id="spinner"></div>
    <div id="mensaje"></div>
    <a href="index.html" class="volver" id="volverLink" style="display:none;">Volver al inicio</a>
</div>

<script>

const mensajeEl = document.getElementById("mensaje");
const spinnerEl = document.getElementById("spinner");
const volverLink = document.getElementById("volverLink");

function mostrarMensaje(texto, tipo){
    spinnerEl.style.display = "none";
    mensajeEl.className = tipo; // "error" o "success"
    mensajeEl.innerText = texto;
}

function mostrarVolver(){
    volverLink.style.display = "inline-block";
}

if (typeof msal === "undefined") {
    mostrarMensaje("Error cargando librería Microsoft Authentication Library.", "error");
    mostrarVolver();

} else {

    // Debe ser IDÉNTICA a la configuración de index.html
    const CLIENT_ID = "2894ba73-12dc-4327-8fb5-9a1a5b2b133e";

    const REDIRECT_URI =
        "https://carsair2026-bi.github.io/Tablero_GrupoCarsa/redirect.html";

    const msalConfig = {
        auth: {
            clientId: CLIENT_ID,
            authority: "https://login.microsoftonline.com/organizations",
            redirectUri: REDIRECT_URI
        },
        cache: {
            cacheLocation: "sessionStorage",
            storeAuthStateInCookie: false
        }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    (async () => {
        try {

            await msalInstance.initialize();

            // Procesa la respuesta que Microsoft agrega en la URL
            // tras el login (código/hash de autenticación)
            const respuesta = await msalInstance.handleRedirectPromise();

            let cuenta = null;

            if (respuesta && respuesta.account) {
                cuenta = respuesta.account;
            } else {
                const cuentas = msalInstance.getAllAccounts();
                if (cuentas.length > 0) {
                    cuenta = cuentas[0];
                }
            }

            if (cuenta) {

                msalInstance.setActiveAccount(cuenta);

                mostrarMensaje(
                    "Bienvenido, " + (cuenta.name || cuenta.username) + ". Redirigiendo...",
                    "success"
                );

                // Cambia "dashboard.html" por la página real
                // a la que quieres enviar al usuario ya logueado
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);

            } else {
                mostrarMensaje(
                    "No se encontró una sesión activa. Intenta iniciar sesión de nuevo.",
                    "error"
                );
                mostrarVolver();
            }

        } catch (error) {
            console.error("Error procesando redirect:", error);
            mostrarMensaje(
                "Ocurrió un error validando tu acceso: " + (error.errorMessage || error.message || "Error desconocido"),
                "error"
            );
            mostrarVolver();
        }
    })();
}

</script>

</body>
</html>
