
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes Grupo Carsa</title>

<link rel="shortcut icon" href="./icono.png">
<link rel="icon" type="image/png" href="./icono.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:linear-gradient(135deg,#f5f7fa,#e4e8f0);
    font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh
}

.oculto{display:none !important}

#vistaLogin{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px
}

.login-card{
    width:90%;
    max-width:650px;
    background:#fff;
    border-radius:28px;
    padding:60px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.15)
}

.login-card .logo{width:420px;max-width:100%;margin-bottom:30px}
.login-card h1{margin:0 0 15px;color:#111}
.subtitle{color:#666;margin-bottom:35px}

.microsoft-button{
    width:100%;
    min-height:68px;
    border:none;
    border-radius:10px;
    background:#2f2f2f;
    color:#fff;
    cursor:pointer;
    font-size:18px;
    font-weight:600;
    transition:background .2s,opacity .2s
}
.microsoft-button:hover{background:#1f1f1f}
.microsoft-button:disabled{opacity:.6;cursor:not-allowed}

#mensaje{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    text-align:left;
    word-break:break-word
}
#mensaje.error{display:block;background:#fdecec;color:#b00020}
#mensaje.success{display:block;background:#eaf7ed;color:#187333}

.footer{margin-top:25px;font-size:12px;color:#999}

#vistaDashboard{padding:20px}

.navbar{
    background:#E51C22;
    border-radius:25px;
    padding:12px 30px;
    margin-bottom:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15)
}

.navbar-left{display:flex;align-items:center;gap:20px}
.navbar .logo{height:80px;width:auto;object-fit:contain}
.navbar-title{color:#fff;font-size:42px;font-weight:800}

.logout-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.15);
    color:#fff;
    border:1px solid rgba(255,255,255,.5);
    border-radius:20px;
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    white-space:nowrap
}
.logout-btn:hover{background:#fff;color:#E51C22}

/* ===== Módulos principales ===== */
.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(200px,280px));
    gap:12px;
    justify-content:center;
    margin:0 auto 15px;
    max-width:1800px
}

.card-btn{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px;
    border-radius:28px;
    background:#fff;
    border-left:8px solid #E51C22;
    cursor:pointer;
    transition:.35s;
    box-shadow:0 5px 5px rgba(0,0,0,.06)
}

.card-btn:hover,
.card-btn.active{
    transform:translateY(-8px);
    background:#E51C22;
    color:#fff;
    box-shadow:0 20px 40px rgba(229,28,34,.25)
}

.card-btn:hover p,
.card-btn:hover i,
.card-btn.active p,
.card-btn.active i{color:#fff}

.card-btn i{font-size:42px;min-width:40px}
.card-btn h3{margin:0;font-size:14px;font-weight:700}
.card-btn p{margin-top:5px;color:#6b7280;font-size:13px}

/* ===== Submódulos ===== */
.subreport-container{
    display:none;
    grid-template-columns:repeat(auto-fit,minmax(240px,280px));
    gap:12px;
    justify-content:center;
    margin:0 auto 20px;
    max-width:1800px
}
.subreport-container.visible{display:grid;animation:aparecer .3s ease}

.subreport-card{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    border:1px solid #e5e7eb;
    border-radius:20px;
    background:#fff;
    color:#111;
    text-align:left;
    font-family:inherit;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 5px 12px rgba(0,0,0,.06)
}
.subreport-card:hover{transform:translateY(-4px);box-shadow:0 12px 25px rgba(229,28,34,.18)}

.subreport-card.active{
    background:linear-gradient(135deg,#ff4d4d,#d90429);
    color:#fff;
    border-color:transparent
}

.sub-icon{
    min-width:46px;
    height:46px;
    border-radius:14px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffe9e9;
    color:#E51C22;
    font-size:22px
}
.subreport-card.active .sub-icon{background:rgba(255,255,255,.2);color:#fff}

.sub-title{display:block;font-size:15px;font-weight:700}
.sub-desc{display:block;margin-top:2px;font-size:12px;color:#6b7280}
.subreport-card.active .sub-desc{color:rgba(255,255,255,.9)}

/* ===== Visor ===== */
.report-card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.12)
}

.report-header{
    background:linear-gradient(135deg,#ff4d4d,#d90429);
    color:#fff;
    padding:14px;
    text-align:center;
    font-size:28px;
    font-weight:700
}

#placeholder{
    height:850px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    background:linear-gradient(135deg,#f8fafc,#eef2f7)
}

.placeholder-title{font-size:48px;font-weight:800;color:#dc3545}
.placeholder-text{margin-top:15px;color:#6b7280;font-size:20px}

.arrow{font-size:60px;display:inline-block;animation:bounce 1.2s infinite}

#visor{width:100%;height:900px;border:none;display:none}

@keyframes bounce{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
}
@keyframes aparecer{
    from{opacity:0;transform:translateY(-6px)}
    to{opacity:1;transform:none}
}

@media(max-width:1200px){
    .dashboard-grid{grid-template-columns:repeat(2,1fr)}
    .navbar{flex-direction:column;justify-content:center;gap:15px}
    .navbar-left{flex-direction:column;text-align:center}
    .navbar-title{font-size:32px}
    .navbar .logo{height:70px}
}

@media(max-width:600px){
    .dashboard-grid{grid-template-columns:1fr}
    .placeholder-title{font-size:32px}
}
</style>
</head>

<script>
const CLIENT_ID = "a18f7ac2-a67a-425e-9abd-140b5c1278b5";

const BASE_URL = "https://carsair2026-bi.github.io/Tablero_GrupoCarsa/";
const msalConfig = {
    auth:{
        clientId:CLIENT_ID,
        authority:"https://login.microsoftonline.com/" + TENANT_ID,
        redirectUri:BASE_URL + "redirect.html",
        postLogoutRedirectUri:BASE_URL + "index.html",
        navigateToLoginRequestUrl:false
    },
    cache:{
        cacheLocation:"sessionStorage",
        storeAuthStateInCookie:false
    }
};

const LOGIN_REQUEST = {
    scopes:["User.Read"],
    prompt:"select_account"
};
let msalInstance = null;
let promesaRetorno = null;

async function getMsal(){

    if(msalInstance){
        return msalInstance;
    }

    if(typeof msal === "undefined"){
        throw new Error("No se pudo cargar la librería de Microsoft (MSAL).");
    }

    msalInstance = new msal.PublicClientApplication(msalConfig);

    await msalInstance.initialize();

    return msalInstance;
}


async function obtenerCuenta(){

    const app = await getMsal();

    if(!promesaRetorno){
        promesaRetorno = app.handleRedirectPromise();
    }

    const respuesta = await promesaRetorno;

    let cuenta =
        (respuesta && respuesta.account) ||
        app.getActiveAccount() ||
        app.getAllAccounts()[0] ||
        null;

    if(
        cuenta &&
        cuenta.tenantId &&
        cuenta.tenantId.toLowerCase() !== TENANT_ID.toLowerCase()
    ){
        cuenta = null;
    }

    if(cuenta){
        app.setActiveAccount(cuenta);
    }

    return cuenta;
}

/* =====================================================

                },

                    u:B+"eyJrIjoiNDg4NWZiNzQtY2M1MC00ZjJhLTg5OWItYmNhNTgyMDY5YzBhIiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=5ef92a0a4e9e89bd680e"

const $ = (id) => document.getElementById(id);


function mostrarMensaje(texto,tipo){
    const el = $("mensaje");
    el.className = tipo;
    el.innerText = texto;
}


function mostrarLogin(){
    $("vistaCarga").classList.add("oculto");
    $("vistaDashboard").classList.add("oculto");
    $("vistaDashboard").innerHTML = "";
    $("vistaLogin").classList.remove("oculto");
}


function mostrarDashboard(){

    const cont = $("vistaDashboard");
    const modulos = obtenerModulos();

    const tarjetas = modulos.map((m,idx) => `
        <div class="card-btn" data-mod="${idx}">
            <i class="bi ${m.i}"></i>
            <div>
                <h3>${m.n}</h3>
                <p>${m.d}</p>
            </div>
        </div>
    `).join("");

    cont.innerHTML = `

        <div class="navbar">
            <div class="navbar-left">
                <img src="logo.png" class="logo" alt="Logo Grupo Carsa">
                <div class="navbar-title">Reportes Grupo Carsa</div>
            </div>
            <button id="btnCerrarSesion" class="logout-btn">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar sesión
            </button>
        </div>

        <div class="dashboard-grid">${tarjetas}</div>

        <div class="subreport-container" id="submodulos"></div>

        <div class="report-card">

            <div class="report-header" id="titulo">Selecciona un reporte</div>

            <div id="placeholder">
                <div class="placeholder-title">
                    <span class="arrow">⬆️</span>
                    Selecciona Tu Reporte
                </div>
                <div class="placeholder-text">
                    Selecciona un módulo y luego un reporte para visualizar la información
                </div>
            </div>

            <iframe id="visor" allowfullscreen></iframe>

        </div>
    `;

    const contSubs = $("submodulos");

    function cargarReporte(modulo,sub,btn){

        if(!sub.u){
            alert("Este reporte aún no tiene enlace de Power BI.");
            return;
        }

        contSubs.querySelectorAll(".subreport-card")
            .forEach((b) => b.classList.remove("active"));

        if(btn){
            btn.classList.add("active");
        }

        $("titulo").innerText = modulo.n + " · " + sub.n;
        $("placeholder").style.display = "none";

        const visor = $("visor");
        visor.style.display = "block";
        visor.src = sub.u;

        document
            .querySelector(".report-card")
            .scrollIntoView({behavior:"smooth",block:"start"});
    }

    function abrirModulo(idx){

        const modulo = modulos[idx];

        cont.querySelectorAll(".card-btn").forEach((c) => {
            c.classList.toggle("active", c.dataset.mod === String(idx));
        });

        contSubs.innerHTML = modulo.s.map((s,j) => `
            <button type="button" class="subreport-card" data-sub="${j}">
                <div class="sub-icon"><i class="bi ${s.i}"></i></div>
                <div>
                    <span class="sub-title">${s.n}</span>
                    <small class="sub-desc">${s.d}</small>
                </div>
            </button>
        `).join("");

        contSubs.classList.add("visible");

        contSubs.querySelectorAll(".subreport-card").forEach((b) => {
            b.addEventListener("click",() => {
                cargarReporte(modulo, modulo.s[b.dataset.sub], b);
            });
        });

        // Si el módulo tiene un solo reporte, se abre directamente
        if(modulo.s.length === 1){
            cargarReporte(
                modulo,
                modulo.s[0],
                contSubs.querySelector(".subreport-card")
            );
        }
    }

    cont.querySelectorAll(".card-btn").forEach((el) => {
        el.addEventListener("click",() => abrirModulo(Number(el.dataset.mod)));
    });

    $("btnCerrarSesion").addEventListener("click",cerrarSesion);

    $("vistaCarga").classList.add("oculto");
    $("vistaLogin").classList.add("oculto");
    cont.classList.remove("oculto");

    iniciarTemporizadorInactividad();
}

async function cerrarSesion(){

    try{

        const app = await getMsal();

        const cuenta =
            app.getActiveAccount() ||
            app.getAllAccounts()[0];

        await app.logoutRedirect({account:cuenta});

    }catch(e){

        console.error(e);

        sessionStorage.clear();

        window.location.replace(BASE_URL + "index.html");
    }
}

const TIEMPO_INACTIVIDAD_MS = 30 * 60 * 1000;

let temporizadorInactividad = null;
let escuchandoActividad = false;


function reiniciarTemporizadorInactividad(){

    clearTimeout(temporizadorInactividad);

    temporizadorInactividad = setTimeout(() => {

        alert("Tu sesión se cerró por inactividad.");

        cerrarSesion();

    },TIEMPO_INACTIVIDAD_MS);
}


function iniciarTemporizadorInactividad(){

    if(!escuchandoActividad){

        ["mousemove","mousedown","keydown","scroll","touchstart","click"]
        .forEach((ev) => {
            document.addEventListener(
                ev,
                reiniciarTemporizadorInactividad,
                {passive:true}
            );
        });

        escuchandoActividad = true;
    }

    reiniciarTemporizadorInactividad();
}

(async() => {

    try{

        const cuenta = await obtenerCuenta();

        if(cuenta){

            history.replaceState(null,"",window.location.pathname);

            mostrarDashboard();

            return;
        }

    }catch(e){

        console.error(e);

        mostrarMensaje(
            "Error de Microsoft: " + (e.errorMessage || e.message || e),
            "error"
        );
    }

    $("loginButton").disabled = false;

    mostrarLogin();

})();

$("loginButton").addEventListener("click",async() => {

    const btn = $("loginButton");

    btn.disabled = true;
    btn.innerText = "Redirigiendo...";

    try{

        const app = await getMsal();

        await app.loginRedirect(LOGIN_REQUEST);

    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudo iniciar sesión: " + (error.errorMessage || error.message),
            "error"
        );

        btn.disabled = false;
        btn.innerText = "Iniciar sesión con Microsoft";
    }
});
</script>
