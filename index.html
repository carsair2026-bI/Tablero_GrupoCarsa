<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso - Grupo Carsa</title>

<link rel="icon" type="image/png" href="./icono.png">

<script src="https://alcdn.msauth.net/browser/2.39.0/js/msal-browser.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#f5f7fa,#e4e8f0);
}

.login-card{
    width:90%;
    max-width:650px;
    background:#ffffff;
    border-radius:28px;
    padding:60px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.15);
}

.logo{
    width:420px;
    max-width:100%;
    margin-bottom:30px;
}

h1{
    margin:0 0 15px;
    color:#111;
}

.subtitle{
    color:#666;
    margin-bottom:35px;
}

.microsoft-button{
    width:100%;
    min-height:68px;
    border:none;
    border-radius:10px;
    background:#2f2f2f;
    color:#fff;
    cursor:pointer;
    font-size:18px;
    font-weight:600;
    transition:.2s;
}

.microsoft-button:hover{
    background:#1f1f1f;
}

#mensaje{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
}

.error{
    display:block !important;
    background:#fdecec;
    color:#b00020;
}

.success{
    display:block !important;
    background:#eaf7ed;
    color:#187333;
}

.footer{
    margin-top:25px;
    font-size:12px;
    color:#999;
}

</style>

</head>

<body>

<div class="login-card">

    <img
        src="./logo.png"
        class="logo"
        alt="Grupo Carsa">

    <h1>Tablero Reportes</h1>

   <p class="subtitle">
        Ingrese con su cuenta corporativa Microsoft
    </p>
    
    <button
        id="loginButton"
        class="microsoft-button"
        onclick="iniciarSesion()">
        Iniciar sesión con Microsoft
    </button>

    <div id="mensaje"></div>

    <div class="footer">
        Acceso exclusivo para usuarios de Integra Retail
    </div>

</div>

<script>

const CLIENT_ID =
"2894ba73-12dc-4327-8fb5-9a1a5b2b133e";

const REDIRECT_URI =
"https://carsair2026-bi.github.io/Tablero_GrupoCarsa/redirect.html";

const PORTAL_URL =
"https://carsair2026-bi.github.io/Tablero_GrupoCarsa/";

const msalConfig = {
    auth: {
        clientId: CLIENT_ID,
        authority: "https://login.microsoftonline.com/organizations",
        redirectUri: REDIRECT_URI,
        postLogoutRedirectUri: PORTAL_URL
    },
    cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
    }
};

const msalInstance =
    new msal.PublicClientApplication(msalConfig);

const loginRequest = {
    scopes: [
        "openid",
        "profile",
        "email"
    ]
};

function mostrarMensaje(texto,tipo){

    const m =
        document.getElementById("mensaje");

    m.innerText = texto;
    m.className = tipo;
}

async function iniciarSesion(){

    try{

        await msalInstance.loginRedirect(
            loginRequest
        );

    }catch(error){

        console.error(error);

        mostrarMensaje(
            error.message,
            "error"
        );
    }
}

async function procesarLogin(){

    try{

        const response =
            await msalInstance.handleRedirectPromise();

        if(!response){
            return;
        }

        const correo =
        (
            response.account.username ||
            response.account.idTokenClaims?.preferred_username ||
            ""
        )
        .toLowerCase()
        .trim();

        if(!correo.endsWith("@integraretail.pe")){

            mostrarMensaje(
                "Acceso permitido solo para cuentas @integraretail.pe",
                "error"
            );

            await msalInstance.logoutRedirect();

            return;
        }

        sessionStorage.setItem(
            "usuarioMicrosoft",
            JSON.stringify({
                correo: correo,
                nombre: response.account.name
            })
        );

        mostrarMensaje(
            "Ingreso correcto",
            "success"
        );

        setTimeout(()=>{
            window.location.href =
                PORTAL_URL;
        },1000);

    }catch(error){

        console.error(error);

        mostrarMensaje(
            error.message,
            "error"
        );
    }
}

window.onload =
    procesarLogin;

</script>

</body>
</html>
