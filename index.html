<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso - Grupo Carsa</title>

<link rel="icon" type="image/png" href="./icono.png">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #e4e8f0);
}

.login-card {
    width: 90%;
    max-width: 650px;
    background: rgba(255,255,255,0.97);
    border-radius: 28px;
    padding: 60px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.15);
}

.logo {
    width: 420px;
    max-height: 200px;
    object-fit: contain;
    margin-bottom: 35px;
}

h1 {
    margin: 0 0 15px;
    font-size: 38px;
    font-weight: 700;
    color: #111;
}

.subtitle {
    margin: 0 0 40px;
    font-size: 20px;
    color: #777;
}

.microsoft-button {
    width: 100%;
    min-height: 68px;
    border: 0;
    border-radius: 10px;
    background: #2f2f2f;
    color: white;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.microsoft-button:hover {
    background: #1f1f1f;
    transform: translateY(-2px);
}

.microsoft-button:disabled {
    opacity: 0.6;
    cursor: wait;
    transform: none;
}

.ms-logo {
    display: inline-grid;
    grid-template-columns: 10px 10px;
    grid-template-rows: 10px 10px;
    gap: 2px;
    margin-right: 12px;
    vertical-align: middle;
}

.ms-logo span:nth-child(1) {
    background: #f25022;
}

.ms-logo span:nth-child(2) {
    background: #7fba00;
}

.ms-logo span:nth-child(3) {
    background: #00a4ef;
}

.ms-logo span:nth-child(4) {
    background: #ffb900;
}

#mensaje {
    display: none;
    margin-top: 25px;
    padding: 15px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
}

.error {
    display: block !important;
    background: #fdecec;
    color: #b00020;
}

.info {
    display: block !important;
    background: #eeeeee;
    color: #555;
}

.success {
    display: block !important;
    background: #eaf7ed;
    color: #187333;
}

.footer {
    margin-top: 30px;
    font-size: 12px;
    color: #999;
}

</style>

<script src="./msal-browser.min.js"></script>

</head>

<body>

<div class="login-card">

    <img
        src="./logo.png"
        class="logo"
        alt="Grupo Carsa"
        onerror="this.style.display='none';">

    <h1>Tablero Reportes</h1>

    <p class="subtitle">
        Ingresa con tu cuenta corporativa de Microsoft
    </p>

    <button
        id="loginButton"
        class="microsoft-button"
        onclick="iniciarSesion()">

        <span class="ms-logo">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </span>

        Iniciar sesión con Microsoft

    </button>

    <div id="mensaje"></div>

    <div class="footer">
        Acceso exclusivo para usuarios de Integra Retail
    </div>

</div>

<script>

const CLIENT_ID = "e8d6dd98-c651-4263-b137-014311fd17af";

const TENANT_ID = "9b387d4f-26ad-4668-a334-8cd1584c609b";

const REDIRECT_URI =
    window.location.origin +
    window.location.pathname.replace(
        /index\.html$/,
        ""
    ) +
    "redirect.html";


const PORTAL_URL =
    window.location.origin +
    window.location.pathname.replace(
        /index\.html$/,
        ""
    ) +
    "portal.html";


const msalConfig = {

    auth: {

        clientId: CLIENT_ID,

        authority:
            "https://login.microsoftonline.com/" +
            TENANT_ID,

        redirectUri:
            REDIRECT_URI,

        postLogoutRedirectUri:
            window.location.origin +
            window.location.pathname

    },

    cache: {

        cacheLocation: "sessionStorage",

        storeAuthStateInCookie: false

    }

};


const msalInstance =
    new msal.PublicClientApplication(
        msalConfig
    );


const loginRequest = {

    scopes: [
        "openid",
        "profile",
        "email"
    ]

};


function mostrarMensaje(
    texto,
    tipo
) {

    const elemento =
        document.getElementById(
            "mensaje"
        );

    elemento.innerText = texto;

    elemento.className = tipo;

}


function ocultarMensaje() {

    const elemento =
        document.getElementById(
            "mensaje"
        );

    elemento.className = "";

    elemento.style.display = "none";

}


function bloquearBoton() {

    const boton =
        document.getElementById(
            "loginButton"
        );

    boton.disabled = true;

    boton.innerText =
        "Conectando con Microsoft...";

}


function desbloquearBoton() {

    const boton =
        document.getElementById(
            "loginButton"
        );

    boton.disabled = false;

    boton.innerHTML = `

        <span class="ms-logo">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </span>

        Iniciar sesión con Microsoft

    `;

}


async function iniciarSesion() {

    ocultarMensaje();

    bloquearBoton();

    try {

        await msalInstance.loginRedirect(
            loginRequest
        );

    } catch (error) {

        console.error(
            "Error Microsoft:",
            error
        );

        desbloquearBoton();

        mostrarMensaje(
            obtenerMensajeError(error),
            "error"
        );

    }

}


function obtenerMensajeError(error) {

    if (!error) {

        return "No fue posible iniciar sesión con Microsoft.";

    }

    if (
        error.errorCode ===
        "user_cancelled"
    ) {

        return "El inicio de sesión fue cancelado.";

    }

    if (
        error.errorCode ===
        "interaction_in_progress"
    ) {

        return "Ya existe un inicio de sesión en proceso.";

    }

    if (
        error.errorCode ===
        "redirect_uri_mismatch"
    ) {

        return "La dirección de redirección no coincide con la registrada en Microsoft Entra.";

    }

    return (
        "No fue posible completar la autenticación con Microsoft. " +
        (
            error.errorMessage ||
            error.message ||
            ""
        )
    );

}


async function procesarRespuestaMicrosoft() {

    try {

        const respuesta =
            await msalInstance.handleRedirectPromise();


        if (
            !respuesta ||
            !respuesta.account
        ) {

            verificarSesion();

            return;

        }


        await validarCuenta(
            respuesta.account
        );


    } catch (error) {

        console.error(
            "Error procesando autenticación:",
            error
        );

        desbloquearBoton();

        mostrarMensaje(
            obtenerMensajeError(error),
            "error"
        );

    }

}


async function validarCuenta(
    cuenta
) {

    const correo = (

        cuenta.username ||

        cuenta.idTokenClaims?.preferred_username ||

        cuenta.idTokenClaims?.email ||

        ""

    ).trim().toLowerCase();


    if (!correo) {

        desbloquearBoton();

        mostrarMensaje(
            "Microsoft no devolvió un correo electrónico válido.",
            "error"
        );

        return;

    }


    console.log(
        "Usuario autenticado:",
        correo
    );


    if (
        !correo.endsWith(
            "@integraretail.pe"
        )
    ) {

        desbloquearBoton();

        mostrarMensaje(
            "Acceso denegado. Debes utilizar una cuenta corporativa @integraretail.pe.",
            "error"
        );

        setTimeout(
            cerrarSesion,
            2500
        );

        return;

    }


    sessionStorage.setItem(
        "usuarioMicrosoft",
        JSON.stringify({

            nombre:
                cuenta.name || "",

            correo:
                correo,

            homeAccountId:
                cuenta.homeAccountId

        })
    );


    mostrarMensaje(
        "Autenticación correcta. Ingresando...",
        "success"
    );


    setTimeout(
        function() {

            window.location.href =
                PORTAL_URL;

        },
        700
    );

}


function verificarSesion() {

    const cuentas =
        msalInstance.getAllAccounts();


    if (
        !cuentas ||
        cuentas.length === 0
    ) {

        return;

    }


    const cuenta =
        cuentas[0];


    const correo = (

        cuenta.username ||

        cuenta.idTokenClaims?.preferred_username ||

        cuenta.idTokenClaims?.email ||

        ""

    ).trim().toLowerCase();


    if (
        correo.endsWith(
            "@integraretail.pe"
        )
    ) {

        sessionStorage.setItem(
            "usuarioMicrosoft",
            JSON.stringify({

                nombre:
                    cuenta.name || "",

                correo:
                    correo,

                homeAccountId:
                    cuenta.homeAccountId

            })
        );


        window.location.href =
            PORTAL_URL;

    }

}


async function cerrarSesion() {

    try {

        sessionStorage.removeItem(
            "usuarioMicrosoft"
        );

        await msalInstance.logoutRedirect();

    } catch (error) {

        console.error(error);

    }

}


window.addEventListener(
    "load",
    procesarRespuestaMicrosoft
);

</script>

</body>
</html>
