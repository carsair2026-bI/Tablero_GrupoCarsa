<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso - Grupo Carsa</title>

<link rel="icon" type="image/png" href="./descarga.png">

<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #e4e8f0);
}

.login-card {
    width: 90%;
    max-width: 650px;
    background: rgba(255,255,255,0.96);
    border-radius: 28px;
    padding: 60px 60px;
    text-align: center;
    box-shadow: 0 25px 70px rgba(0,0,0,0.15);
}

.logo {
    width: 220px;
    max-height: 100px;
    object-fit: contain;
    margin-bottom: 35px;
}

h1 {
    margin: 0 0 18px;
    font-size: 38px;
    font-weight: 700;
    color: #111;
}

.subtitle {
    margin: 0 0 45px;
    font-size: 20px;
    color: #777;
}

.microsoft-button {
    width: 100%;
    min-height: 68px;
    border: 0;
    border-radius: 10px;
    background: #2f2f2f;
    color: white;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.microsoft-button:hover {
    background: #1f1f1f;
    transform: translateY(-2px);
}

.microsoft-button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.ms-logo {
    display: inline-grid;
    grid-template-columns: 10px 10px;
    grid-template-rows: 10px 10px;
    gap: 2px;
    margin-right: 12px;
    vertical-align: middle;
}

.ms-logo span:nth-child(1) {
    background: #f25022;
}

.ms-logo span:nth-child(2) {
    background: #7fba00;
}

.ms-logo span:nth-child(3) {
    background: #00a4ef;
}

.ms-logo span:nth-child(4) {
    background: #ffb900;
}

#mensaje {
    display: none;
    margin-top: 25px;
    padding: 16px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.5;
}

.error {
    background: #fdecec;
    color: #b00020;
}

.info {
    background: #eeeeee;
    color: #555;
}

.footer {
    margin-top: 30px;
    font-size: 12px;
    color: #aaa;
}

</style>
</head>

<body>

<div class="login-card">

    <img
        src="./carsa.png"
        class="logo"
        alt="Grupo Carsa"
        onerror="this.style.display='none';">

    <h1>Tablero Reportes</h1>

    <p class="subtitle">
        Ingresa con tu cuenta corporativa de Microsoft
    </p>

    <button
        id="loginButton"
        class="microsoft-button"
        onclick="iniciarSesion()">

        <span class="ms-logo">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </span>

        Iniciar sesión con Microsoft

    </button>

    <div id="mensaje"></div>

    <div class="footer">
        Acceso exclusivo para usuarios de Integra Retail
    </div>

</div>

<script>

const CLIENT_ID = "PON_AQUI_TU_CLIENT_ID";

const TENANT_ID = "PON_AQUI_TU_TENANT_ID";

const LOGIN_URL = "https://TU_SERVIDOR/login";


const msalConfig = {

    auth: {

        clientId: CLIENT_ID,

        authority:
            "https://login.microsoftonline.com/" +
            TENANT_ID,

        redirectUri:
            window.location.origin +
            window.location.pathname

    },

    cache: {

        cacheLocation: "sessionStorage",

        storeAuthStateInCookie: false

    }

};


const msalInstance =
    new msal.PublicClientApplication(msalConfig);


const loginRequest = {

    scopes: [
        "openid",
        "profile",
        "email"
    ]

};


function mensaje(texto, tipo) {

    const elemento =
        document.getElementById("mensaje");

    elemento.innerText = texto;

    elemento.className = tipo;

    elemento.style.display = "block";

}


async function iniciarSesion() {

    const boton =
        document.getElementById("loginButton");

    boton.disabled = true;

    boton.innerText =
        "Conectando con Microsoft...";

    document.getElementById(
        "mensaje"
    ).style.display = "none";

    try {

        const respuesta =
            await msalInstance.loginPopup(
                loginRequest
            );

        if (!respuesta || !respuesta.account) {

            throw new Error(
                "Microsoft no devolvió una cuenta."
            );

        }


        const cuenta =
            respuesta.account;


        const correo = (

            cuenta.username ||

            cuenta.idTokenClaims?.preferred_username ||

            cuenta.idTokenClaims?.email ||

            ""

        ).trim().toLowerCase();


        console.log(
            "Usuario autenticado:",
            correo
        );


        if (!correo) {

            throw new Error(
                "No se pudo obtener el correo de Microsoft."
            );

        }


        if (!correo.endsWith("@integraretail.pe")) {

            try {

                await msalInstance.logoutPopup({
                    account: cuenta
                });

            } catch (e) {

                console.log(e);

            }


            boton.disabled = false;

            boton.innerText =
                "Iniciar sesión con Microsoft";


            mensaje(
                "Acceso denegado. Debes utilizar una cuenta corporativa @integraretail.pe.",
                "error"
            );

            return;

        }


        sessionStorage.setItem(
            "usuarioMicrosoft",
            JSON.stringify({

                nombre:
                    cuenta.name || "",

                correo:
                    correo,

                homeAccountId:
                    cuenta.homeAccountId

            })
        );


        mensaje(
            "Autenticación correcta. Redirigiendo...",
            "info"
        );


        setTimeout(function() {

            window.location.href =
                LOGIN_URL +
                "?usuario=" +
                encodeURIComponent(correo);

        }, 800);


    } catch (error) {

        console.error(
            "ERROR MICROSOFT:",
            error
        );


        boton.disabled = false;

        boton.innerText =
            "Iniciar sesión con Microsoft";


        let texto =
            "No fue posible completar la autenticación con Microsoft.";


        if (error.errorCode) {

            texto +=
                " Código: " +
                error.errorCode;

        }


        if (error.errorMessage) {

            texto +=
                " " +
                error.errorMessage;

        }


        mensaje(
            texto,
            "error"
        );

    }

}

</script>

</body>
</html>
