
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Grupo Carsa</title>

    <link rel="shortcut icon" href="./icono.png">
    <link rel="icon" type="image/png" href="./icono.png">

    <script src="https://alcdn.msauth.net/browser/2.37.1/js/msal-browser.min.js"
            onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.37.1/lib/msal-browser.min.js';s.onload=initMsal;s.onerror=function(){mostrarMensaje('No se pudo cargar la librería de Microsoft. Revisa tu conexión.','error');};document.head.appendChild(s);"></script>

    <style>
        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:"Segoe UI",Arial,sans-serif;
            background:linear-gradient(135deg,#f5f7fa,#e4e8f0);
        }

        .login-card{
            width:90%;
            max-width:650px;
            background:#fff;
            border-radius:28px;
            padding:60px;
            text-align:center;
            box-shadow:0 25px 70px rgba(0,0,0,.15);
        }

        .logo{
            width:420px;
            max-width:100%;
            margin-bottom:30px;
        }

        h1{
            margin:0 0 15px;
            color:#111;
        }

        .subtitle{
            color:#666;
            margin-bottom:35px;
        }

        .microsoft-button{
            width:100%;
            min-height:68px;
            border:none;
            border-radius:10px;
            background:#2f2f2f;
            color:#fff;
            cursor:pointer;
            font-size:18px;
            font-weight:600;
            transition: background .2s ease, opacity .2s ease;
        }

        .microsoft-button:hover{
            background:#1f1f1f;
        }

        .microsoft-button:disabled{
            opacity:.6;
            cursor:not-allowed;
        }

        #mensaje{
            display:none;
            margin-top:20px;
            padding:15px;
            border-radius:10px;
            text-align:left;
        }

        .error{
            display:block;
            background:#fdecec;
            color:#b00020;
        }

        .success{
            display:block;
            background:#eaf7ed;
            color:#187333;
        }

        .footer{
            margin-top:25px;
            font-size:12px;
            color:#999;
        }
    </style>
</head>

<body>

<div class="login-card">

    <img src="logo.png" class="logo" alt="Grupo Carsa">

    <h1>Tablero Reportes</h1>

    <p class="subtitle">
        Ingrese con su cuenta corporativa Microsoft
    </p>

    <button
        id="loginButton"
        class="microsoft-button">
        Iniciar sesión con Microsoft
    </button>

    <div id="mensaje"></div>

    <div class="footer">
        Acceso exclusivo para usuarios de Integra Retail
    </div>

</div>

<script>

const mensajeEl = document.getElementById("mensaje");
const loginButton = document.getElementById("loginButton");

function mostrarMensaje(texto, tipo){
    mensajeEl.className = tipo; // "error" o "success"
    mensajeEl.innerText = texto;
}

let msalInstance = null;

function initMsal() {

    if (typeof msal === "undefined") {
        console.error("MSAL no cargó");
        mostrarMensaje(
            "Error cargando librería Microsoft Authentication Library.",
            "error"
        );
        loginButton.disabled = true;
        return;
    }

    // ---- CONFIGURACIÓN ----
    // Client ID de tu registro en Azure AD (App registrations)
    const CLIENT_ID = "2894ba73-12dc-4327-8fb5-9a1a5b2b133e";

    // Debe coincidir EXACTAMENTE con el Redirect URI configurado
    // en Azure Portal > App registrations > tu app > Authentication
    const REDIRECT_URI =
        "https://carsair2026-bi.github.io/Tablero_GrupoCarsa/redirect.html";

    // Si la app solo debe aceptar cuentas de tu tenant, usa:
    // "https://login.microsoftonline.com/TU_TENANT_ID"
    // "organizations" acepta cualquier cuenta trabajo/escuela (multi-tenant)
    const msalConfig = {
        auth: {
            clientId: CLIENT_ID,
            authority: "https://login.microsoftonline.com/organizations",
            redirectUri: REDIRECT_URI
        },
        cache: {
            cacheLocation: "sessionStorage",
            storeAuthStateInCookie: false
        }
    };

    msalInstance = new msal.PublicClientApplication(msalConfig);

    // Si el usuario ya inició sesión antes en esta pestaña, evita
    // mostrarle el botón innecesariamente
    (async () => {
        try {
            await msalInstance.initialize();
            const cuentas = msalInstance.getAllAccounts();
            if (cuentas.length > 0) {
                mostrarMensaje("Sesión activa detectada, redirigiendo...", "success");
                window.location.href = "dashboard.html";
            }
        } catch (e) {
            console.error("Error inicializando MSAL:", e);
        }
    })();

    loginButton.disabled = false;

    loginButton.addEventListener("click", async () => {

        loginButton.disabled = true;
        loginButton.innerText = "Redirigiendo...";

        try {

            await msalInstance.loginRedirect({
                scopes: [
                    "openid",
                    "profile",
                    "email",
                    "User.Read"
                ]
            });
            // loginRedirect navega fuera de la página; el código
            // después de esta línea normalmente no se ejecuta.

        } catch (error) {

            console.error("Error en login:", error);

            mostrarMensaje(
                "No se pudo iniciar sesión: " + (error.errorMessage || error.message || "Error desconocido"),
                "error"
            );

            loginButton.disabled = false;
            loginButton.innerText = "Iniciar sesión con Microsoft";
        }
    });
}

// Si el script principal ya cargó normalmente, inicializa de inmediato.
// Si falló y se está usando el respaldo de jsDelivr, initMsal() se
// llama desde el "onload" de ese script (ver el <script> de arriba).
if (typeof msal !== "undefined") {
    initMsal();
}

</script>

</body>
</html>
