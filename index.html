<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes Grupo Carsa</title>

<link rel="shortcut icon" href="./icono.png">
<link rel="icon" type="image/png" href="./icono.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box
}

body{
    background:linear-gradient(135deg,#f5f7fa,#e4e8f0);
    font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh
}

.oculto{
    display:none !important
}

/* LOGIN */
#vistaLogin{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px
}

.login-card{
    width:90%;
    max-width:650px;
    background:#fff;
    border-radius:28px;
    padding:60px;
    text-align:center;
    box-shadow:0 25px 70px rgba(0,0,0,.15)
}

.login-card .logo{
    width:420px;
    max-width:100%;
    margin-bottom:30px
}

.login-card h1{
    margin:0 0 15px;
    color:#111
}

.subtitle{
    color:#666;
    margin-bottom:35px
}

.microsoft-button{
    width:100%;
    min-height:68px;
    border:none;
    border-radius:10px;
    background:#2f2f2f;
    color:#fff;
    cursor:pointer;
    font-size:18px;
    font-weight:600;
    transition:background .2s,opacity .2s
}

.microsoft-button:hover{
    background:#1f1f1f
}

.microsoft-button:disabled{
    opacity:.6;
    cursor:not-allowed
}

#mensaje{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    text-align:left;
    word-break:break-word
}

#mensaje.error{
    display:block;
    background:#fdecec;
    color:#b00020
}

#mensaje.success{
    display:block;
    background:#eaf7ed;
    color:#187333
}

.footer{
    margin-top:25px;
    font-size:12px;
    color:#999
}

/* DASHBOARD */
#vistaDashboard{
    padding:20px
}

.navbar{
    background:#E51C22;
    border-radius:25px;
    padding:12px 30px;
    margin-bottom:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15)
}

.navbar-left{
    display:flex;
    align-items:center;
    gap:20px
}

.navbar .logo{
    height:80px;
    width:auto;
    object-fit:contain
}

.navbar-title{
    color:#fff;
    font-size:42px;
    font-weight:800
}

.logout-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(255,255,255,.15);
    color:#fff;
    border:1px solid rgba(255,255,255,.5);
    border-radius:20px;
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    white-space:nowrap
}

.logout-btn:hover{
    background:#fff;
    color:#E51C22
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(200px,280px));
    gap:12px;
    justify-content:center;
    margin:0 auto 15px;
    max-width:1800px
}

.card-btn{
    display:flex;
    align-items:center;
    gap:16px;
    padding:20px;
    border-radius:28px;
    background:#fff;
    border-left:8px solid #E51C22;
    cursor:pointer;
    transition:.35s;
    box-shadow:0 5px 5px rgba(0,0,0,.06)
}

.card-btn:hover{
    transform:translateY(-8px);
    background:#E51C22;
    color:#fff;
    box-shadow:0 20px 40px rgba(229,28,34,.25)
}

.card-btn:hover p,
.card-btn:hover i{
    color:#fff
}

.card-btn i{
    font-size:42px;
    min-width:40px
}

.card-btn h3{
    margin:0;
    font-size:14px;
    font-weight:700
}

.card-btn p{
    margin-top:5px;
    color:#6b7280;
    font-size:13px
}

.report-card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.12)
}

.report-header{
    background:linear-gradient(135deg,#ff4d4d,#d90429);
    color:#fff;
    padding:14px;
    text-align:center;
    font-size:28px;
    font-weight:700
}

#placeholder{
    height:850px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(135deg,#f8fafc,#eef2f7)
}

.placeholder-title{
    font-size:48px;
    font-weight:800;
    color:#dc3545
}

.placeholder-text{
    margin-top:15px;
    color:#6b7280;
    font-size:20px
}

.arrow{
    font-size:60px;
    display:inline-block;
    animation:bounce 1.2s infinite
}

#visor{
    width:100%;
    height:900px;
    border:none;
    display:none
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0)
    }

    50%{
        transform:translateY(-10px)
    }
}

@media(max-width:1200px){
    .dashboard-grid{
        grid-template-columns:repeat(2,1fr)
    }

    .navbar{
        flex-direction:column;
        justify-content:center;
        gap:15px
    }

    .navbar-left{
        flex-direction:column;
        text-align:center
    }

    .navbar-title{
        font-size:32px
    }

    .navbar .logo{
        height:70px
    }
}

@media(max-width:600px){
    .dashboard-grid{
        grid-template-columns:1fr
    }
}
</style>
</head>

<body>

<!-- PANTALLA DE CARGA -->
<div id="vistaCarga" style="min-height:100vh;display:flex;justify-content:center;align-items:center;color:#666">
    Validando acceso...
</div>

<!-- LOGIN MICROSOFT -->
<div id="vistaLogin" class="oculto">
    <div class="login-card">

        <img src="logo.png" class="logo" alt="Grupo Carsa">

        <h1>Tablero Reportes</h1>

        <p class="subtitle">
            Ingrese con su cuenta corporativa Microsoft
        </p>

        <button id="loginButton" class="microsoft-button" disabled>
            Iniciar sesión con Microsoft
        </button>

        <div id="mensaje"></div>

        <div class="footer">
            Acceso exclusivo para usuarios de Integra Retail
        </div>

    </div>
</div>

<!-- DASHBOARD -->
<div id="vistaDashboard" class="oculto"></div>

<!-- MSAL -->
<script src="https://alcdn.msauth.net/browser/2.37.1/js/msal-browser.min.js"></script>

<script>
if(typeof msal === "undefined"){
    document.write(
        '<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.37.1/lib/msal-browser.min.js"><\/script>'
    );
}
</script>

<script>

/* ================== CONFIGURACIÓN MICROSOFT ================== */

const CLIENT_ID = "a18f7ac2-a67a-425e-9abd-140b5c1278b5";

const TENANT_ID = "0208acf3-2bb4-4c3b-80d9-36a683f79fd6";

const BASE_URL = "https://carsair2026-bi.github.io/Tablero_GrupoCarsa/";

const msalConfig = {
    auth:{
        clientId:CLIENT_ID,
        authority:"https://login.microsoftonline.com/" + TENANT_ID,
        redirectUri:BASE_URL + "redirect.html",
        postLogoutRedirectUri:BASE_URL + "index.html",
        navigateToLoginRequestUrl:false
    },

    cache:{
        cacheLocation:"sessionStorage",
        storeAuthStateInCookie:false
    }
};

const LOGIN_REQUEST = {
    scopes:["User.Read"],
    prompt:"select_account"
};


/* ================== SESIÓN MICROSOFT ================== */

let msalInstance = null;
let promesaRetorno = null;

async function getMsal(){

    if(msalInstance){
        return msalInstance;
    }

    if(typeof msal === "undefined"){
        throw new Error(
            "No se pudo cargar la librería de Microsoft (MSAL)."
        );
    }

    msalInstance = new msal.PublicClientApplication(msalConfig);

    await msalInstance.initialize();

    return msalInstance;
}


async function obtenerCuenta(){

    const app = await getMsal();

    if(!promesaRetorno){
        promesaRetorno = app.handleRedirectPromise();
    }

    const respuesta = await promesaRetorno;

    let cuenta =
        (respuesta && respuesta.account) ||
        app.getActiveAccount() ||
        app.getAllAccounts()[0] ||
        null;


    /* Solo cuentas del tenant corporativo */

    if(
        cuenta &&
        cuenta.tenantId &&
        cuenta.tenantId.toLowerCase() !== TENANT_ID.toLowerCase()
    ){
        cuenta = null;
    }


    if(cuenta){
        app.setActiveAccount(cuenta);
    }

    return cuenta;
}


/* ================== REPORTES ================== */

function obtenerReportes(){

    const B = "https://app.powerbi.com/view?r=";

    return [

        {
            n:"Rentabilidad",
            i:"bi-cash-coin",
            d:"Indicadores Financieros",
            u:B+"eyJrIjoiYzM5NWNkMjMtYmQ3MC00ZTBiLWFlMmItN2EzOTM5OWM3N2UxIiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=4f3ec2d505b72e41aec3"
        },

        {
            n:"Venta QT",
            i:"bi-graph-up-arrow",
            d:"Indicadores comerciales",
            u:B+"eyJrIjoiZDEwZWI3NjgtMTE0Mi00NmNmLWI3NTctMmUzY2Y0NzVmZTQ4IiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=2b13e294406015565300"
        },

        {
            n:"Venta CrediCash",
            i:"bi-cash",
            d:"Indicadores Desembolso Efectivo",
            u:B+"eyJrIjoiMjZkMmU3MjctZjk2My00ZGVlLWI1YzEtNjdmNjgwOGYzODc5IiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=2b13e294406015565300"
        },

        {
            n:"Alianzas y Aliados",
            i:"bi-people",
            d:"Formas de Pago Aliados",
            u:B+"eyJrIjoiNDg4NWZiNzQtYzM1MC00ZjJhLTg5OWItYmNhNTgyMDY5YzBhIiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=5ef92a0a4e9e89bd680e"
        },

        {
            n:"Productividad",
            i:"bi-lightning-charge",
            d:"Seguimiento de Productividad por vendedor",
            u:B+"eyJrIjoiMTFkN2Q0NzQtNDQ0OS00MmRmLWI3N2YtYzYzZTA2NGQwOTdjIiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=75c69a2c852cdab9c419"
        },

        {
            n:"Liquidación Antigüedad",
            i:"bi-calendar-check",
            d:"Seguimiento de antigüedad",
            u:B+"eyJrIjoiZGU5NWZkMWItMzQyZC00MWYxLWI4MmEtY2VkODFkNTUxMzU1IiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=9d45593874a64936a66d"
        },

        {
            n:"Bolsa Tienda",
            i:"bi-bar-chart-fill",
            d:"Indicadores estratégicos",
            u:B+"eyJrIjoiNWE0OWJhMWMtNTU5Ny00YmU5LWI2N2QtOGNjYzg2YjMwZDEzIiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=eccb299d317937f2f476"
        },

        {
            n:"Integrados",
            i:"bi-bar-chart-fill",
            d:"Indicadores estratégicos",
            u:B+"eyJrIjoiNjNiMTU2MzQtYWI2Ni00NWI5LTg4OWEtYzAwZjViMjg4NGFlIiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=4f3ec2d505b72e41aec3"
        },

        {
            n:"OIC",
            i:"bi-eye",
            d:"Indicadores OIC",
            u:B+"eyJrIjoiZTZiNjBkNGYtMTBmOS00YWU5LWEyMmEtMzI0MDIyZjdkMzhhIiwidCI6IjAyMDhhY2YzLTJiYjQtNGMzYi04MGQ5LTM2YTY4M2Y3OWZkNiJ9&pageName=2b13e294406015565300"
        }

    ];
}


/* ================== UTILIDADES ================== */

const $ = (id) => document.getElementById(id);


function mostrarMensaje(texto,tipo){

    const el = $("mensaje");

    el.className = tipo;

    el.innerText = texto;
}


function mostrarLogin(){

    $("vistaCarga").classList.add("oculto");

    $("vistaDashboard").classList.add("oculto");

    $("vistaDashboard").innerHTML = "";

    $("vistaLogin").classList.remove("oculto");
}


/* ================== DASHBOARD ================== */

function mostrarDashboard(){

    const cont = $("vistaDashboard");

    const reportes = obtenerReportes();


    const tarjetas = reportes.map((r,idx) => `

        <div class="card-btn" data-idx="${idx}">

            <i class="bi ${r.i}"></i>

            <div>
                <h3>${r.n}</h3>
                <p>${r.d}</p>
            </div>

        </div>

    `).join("");


    cont.innerHTML = `

        <div class="navbar">

            <div class="navbar-left">

                <img
                    src="logo.png"
                    class="logo"
                    alt="Logo Grupo Carsa"
                >

                <div class="navbar-title">
                    Reportes Grupo Carsa
                </div>

            </div>


            <button id="btnCerrarSesion" class="logout-btn">

                <i class="bi bi-box-arrow-right"></i>

                Cerrar sesión

            </button>

        </div>


        <div class="dashboard-grid">
            ${tarjetas}
        </div>


        <div class="report-card">

            <div
                class="report-header"
                id="titulo"
            >
                Selecciona un reporte
            </div>


            <div id="placeholder">

                <div class="placeholder-title">

                    <span class="arrow">
                        ⬆️
                    </span>

                    Selecciona Tu Reporte

                </div>


                <div class="placeholder-text">

                    Selecciona uno de los reportes para visualizar la información

                </div>

            </div>


            <iframe
                id="visor"
                allowfullscreen
            ></iframe>

        </div>

    `;


    cont.querySelectorAll(".card-btn").forEach((el) => {

        el.addEventListener("click",() => {

            const r = reportes[el.dataset.idx];

            $("titulo").innerText = r.n;

            $("placeholder").style.display = "none";

            const visor = $("visor");

            visor.style.display = "block";

            visor.src = r.u;

            document
                .querySelector(".report-card")
                .scrollIntoView({
                    behavior:"smooth",
                    block:"start"
                });

        });

    });


    $("btnCerrarSesion").addEventListener(
        "click",
        cerrarSesion
    );


    $("vistaCarga").classList.add("oculto");

    $("vistaLogin").classList.add("oculto");

    cont.classList.remove("oculto");


    iniciarTemporizadorInactividad();

}


/* ================== CERRAR SESIÓN MICROSOFT ================== */

async function cerrarSesion(){

    try{

        const app = await getMsal();

        const cuenta =
            app.getActiveAccount() ||
            app.getAllAccounts()[0];

        await app.logoutRedirect({
            account:cuenta
        });

    }catch(e){

        console.error(e);

        sessionStorage.clear();

        window.location.replace(
            BASE_URL + "index.html"
        );

    }

}


/* ================== INACTIVIDAD ================== */

const TIEMPO_INACTIVIDAD_MS =
    30 * 60 * 1000;

let temporizadorInactividad = null;

let escuchandoActividad = false;


function reiniciarTemporizadorInactividad(){

    clearTimeout(
        temporizadorInactividad
    );

    temporizadorInactividad =
        setTimeout(() => {

            alert(
                "Tu sesión se cerró por inactividad."
            );

            cerrarSesion();

        },TIEMPO_INACTIVIDAD_MS);

}


function iniciarTemporizadorInactividad(){

    if(!escuchandoActividad){

        [
            "mousemove",
            "mousedown",
            "keydown",
            "scroll",
            "touchstart",
            "click"
        ].forEach((ev) => {

            document.addEventListener(
                ev,
                reiniciarTemporizadorInactividad,
                {passive:true}
            );

        });

        escuchandoActividad = true;

    }

    reiniciarTemporizadorInactividad();

}


/* ================== ARRANQUE ================== */

(async() => {

    try{

        const cuenta = await obtenerCuenta();


        if(cuenta){

            /*
             * Limpia el código de autorización
             * de la barra de direcciones.
             */

            history.replaceState(
                null,
                "",
                window.location.pathname
            );


            mostrarDashboard();

            return;

        }


    }catch(e){

        console.error(e);

        mostrarMensaje(
            "Error de Microsoft: " +
            (e.errorMessage || e.message || e),
            "error"
        );

    }


    /*
     * Si no existe una sesión Microsoft,
     * mostramos únicamente el botón Microsoft.
     */

    $("loginButton").disabled = false;

    mostrarLogin();

})();


/* ================== LOGIN MICROSOFT ================== */

$("loginButton").addEventListener(
    "click",
    async() => {

        const btn = $("loginButton");

        btn.disabled = true;

        btn.innerText = "Redirigiendo...";


        try{

            const app = await getMsal();

            await app.loginRedirect(
                LOGIN_REQUEST
            );

        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo iniciar sesión: " +
                (error.errorMessage || error.message),
                "error"
            );


            btn.disabled = false;

            btn.innerText =
                "Iniciar sesión con Microsoft";

        }

    }
);

</script>

</html>
