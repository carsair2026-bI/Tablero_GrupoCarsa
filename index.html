<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso - Grupo Carsa</title>

    <link relng

    <script src="https://alcdn.msauth.net/browser/2.39.0/js/msal-browser.min.js">
    </script>
    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:"Segoe UI",Arial,sans-serif;
            background:linear-gradient(135deg,#f5f7fa,#e4e8f0);
        }

        .login-card{
            width:90%;
            max-width:650px;
            background:#fff;
            border-radius:28px;
            padding:60px;
            text-align:center;
            box-shadow:0 25px 70px rgba(0,0,0,.15);
        }

        .logo{
            width:420px;
            max-width:100%;
            margin-bottom:30px;
        }

        h1{
            margin:0 0 15px;
            color:#111;
        }

        .subtitle{
            color:#666;
            margin-bottom:35px;
        }

        .microsoft-button{
            width:100%;
            min-height:68px;
            border:none;
            border-radius:10px;
            background:#2f2f2f;
            color:#fff;
            cursor:pointer;
            font-size:18px;
            font-weight:600;
        }

        .microsoft-button:hover{
            background:#1f1f1f;
        }

        .footer{
            margin-top:25px;
            font-size:12px;
            color:#999;
        }

        #mensaje{
            display:none;
            margin-top:20px;
            padding:15px;
            border-radius:10px;
        }

        .error{
            display:block;
            background:#fdecec;
            color:#b00020;
        }

        .success{
            display:block;
            background:#eaf7ed;
            color:#187333;
        }

    </style>

</head>

<body>

<div class="login-card">

    ./logo.png

    <h1>Tablero Reportes</h1>

    <p class="subtitle">
        Ingrese con su cuenta corporativa Microsoft
    </p>

    <button
        id="loginButton"
        class="microsoft-button">
        Iniciar sesión con Microsoft
    </button>

    <div id="mensaje"></div>

    <div class="footer">
        Acceso exclusivo para usuarios de Integra Retail
    </div>

</div>

<script>

const CLIENT_ID = "2894ba73-12dc-4327-8fb5-9a1a5b2b133e";

const REDIRECT_URI =
"https://carsair2026-bi.github.io/Tablero_GrupoCarsa/redirect.html";

const msalConfig = {
    auth: {
        clientId: CLIENT_ID,
        authority: "https://login.microsoftonline.com/organizations",
        redirectUri: REDIRECT_URI
    },
    cache: {
        cacheLocation: "sessionStorage"
    }
};

const msalInstance =
    new msal.PublicClientApplication(msalConfig);

document
.getElementById("loginButton")
.addEventListener("click", async () => {

    try {

        await msalInstance.loginRedirect({
            scopes: ["openid","profile","email"]
        });

    } catch(error) {

        console.error(error);

        const mensaje =
            document.getElementById("mensaje");

        mensaje.className = "error";
        mensaje.innerText = error.message;
    }

});

</script>

</body>
</html>
