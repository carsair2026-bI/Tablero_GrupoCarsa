<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="icon" href="./icono.png">

    <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

    <style>
        * {
            box-sizing: border-box;

            min-height: 100vh;

            background: #f25022;

            background: #7fba00;
        }

            background: #00a4ef;
        }

        .microsoft-logo span:nth-child(4) {
            background: #ffb900;

            display: none;

<body>

<div class="login-container">
    <div class="login-card">

        <img src="./logo.png" class="logo" alt="Grupo Integra">

        <h1>Acceso al sistema</h1>

        <p class="subtitle">
            Inicia sesión con tu cuenta corporativa de Microsoft.
        </p>

        <button
            id="loginButton"
            class="microsoft-button"
            onclick="loginMicrosoft()">

            <span class="microsoft-logo">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </span>

            Iniciar sesión con Microsoft
        </button>

        <div id="message" class="message"></div>

        <div class="footer">
            Acceso exclusivo para usuarios de Integra Retail
        </div>

    </div>
</div>

<script>

const msalConfig = {
    auth: {
        clientId: "TU_CLIENT_ID",
        authority: "https://login.microsoftonline.com/TU_TENANT_ID",
        redirectUri: window.location.origin + "/"
    },

    cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
    }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);

const loginRequest = {
    scopes: [
        "openid",
        "profile",
        "email"
    ]
};

function mostrarMensaje(texto, tipo) {

    const message = document.getElementById("message");

    message.innerText = texto;
    message.className = "message " + tipo;
    message.style.display = "block";
}

function ocultarMensaje() {

    const message = document.getElementById("message");

    message.style.display = "none";
}

function bloquearBoton() {

    const button = document.getElementById("loginButton");

    button.disabled = true;
    button.style.opacity = "0.6";
    button.innerText = "Validando acceso...";
}

function habilitarBoton() {

    const button = document.getElementById("loginButton");

    button.disabled = false;
    button.style.opacity = "1";
    button.innerText = "Iniciar sesión con Microsoft";
}

async function loginMicrosoft() {

    ocultarMensaje();
    bloquearBoton();

    try {

        const response = await msalInstance.loginPopup(loginRequest);

        await validarUsuario(response);

    } catch (error) {

        console.error(error);

        habilitarBoton();

        mostrarMensaje(
            "No fue posible completar la autenticación con Microsoft.",
            "error"
        );
    }
}

async function validarUsuario(response) {

    if (!response || !response.account) {

        habilitarBoton();

        mostrarMensaje(
            "No se pudo obtener la cuenta de Microsoft.",
            "error"
        );

        return;
    }

    const account = response.account;

    const correo = (
        account.username ||
        account.idTokenClaims?.preferred_username ||
        account.idTokenClaims?.email ||
        ""
    ).trim().toLowerCase();

    if (!correo) {

        habilitarBoton();

        mostrarMensaje(
            "Microsoft no devolvió un correo electrónico válido.",
            "error"
        );

        return;
    }

    if (!correo.endsWith("@integraretail.pe")) {

        await msalInstance.logoutPopup({
            account: account
        });

        habilitarBoton();

        mostrarMensaje(
            "Acceso denegado. Debes utilizar una cuenta corporativa @integraretail.pe.",
            "error"
        );

        return;
    }

    mostrarMensaje(
        "Autenticación correcta. Redirigiendo...",
        "loading"
    );

    sessionStorage.setItem(
        "usuarioMicrosoft",
        JSON.stringify({
            nombre: account.name || "",
            correo: correo,
            homeAccountId: account.homeAccountId
        })
    );

    setTimeout(function() {

        window.location.href = "./login";

    }, 500);
}

async function comprobarSesion() {

    try {

        const accounts = msalInstance.getAllAccounts();

        if (accounts.length > 0) {

            const account = accounts[0];

            const correo = (
                account.username ||
                account.idTokenClaims?.preferred_username ||
                account.idTokenClaims?.email ||
                ""
            ).trim().toLowerCase();

            if (correo.endsWith("@integraretail.pe")) {

                sessionStorage.setItem(
                    "usuarioMicrosoft",
                    JSON.stringify({
                        nombre: account.name || "",
                        correo: correo,
                        homeAccountId: account.homeAccountId
                    })
                );

                window.location.href = "./login";
            }
        }

    } catch (error) {

        console.error(error);
    }
}

window.addEventListener("load", function() {

    comprobarSesion();

});

</script>

</body>
</html>
